name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute inactivity sleep
    - cron: '*/14 * * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API Health Endpoint
        run: curl -s -o /dev/null -w "%{http_code}" https://food-management-system-backend.onrender.com/api/health | grep 200 || echo "Ping successful but returned non-200"
